name: RC5 public HTTPS verification
on:
  push:
    branches: [review/sky-rush-rc5-local-session-20261104]
    paths: [.github/workflows/rc5-live-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3e317944895d4149e76b56310e0fea04b7813af
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/rc5-live"
          npm install --prefix "$RUNNER_TEMP/rc5-live" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/rc5-live/node_modules/.bin/playwright" install chromium
      - name: Compare public files and run uninstrumented public game
        env:
          NODE_PATH: ${{ runner.temp }}/rc5-live/node_modules
        run: |
          mkdir -p evidence
          cat > "$RUNNER_TEMP/rc5-live/check.cjs" <<'JS'
          const fs=require('fs'),path=require('path'),assert=require('assert/strict'),crypto=require('crypto'),{chromium}=require('playwright');
          const root=process.env.GITHUB_WORKSPACE,base='https://thafarmaaitah.github.io/Bouncing-/',version='a3e317944895d4149e76b56310e0fea04b7813af';
          const report={started:new Date().toISOString(),version,http:[],runtime:[],notTested:['Private V4.1 file','Physical iPad','Live full-route and win regression','Child enjoyment']};
          const h=b=>crypto.createHash('sha256').update(b).digest('hex');
          const added=fs.readdirSync(path.join(root,'review/v29-rc5')).map(n=>'review/v29-rc5/'+n);
          const preserved=['index.html','sky-rush-adventure.html','sky-rush-adventure-v28.html','sky-rush-lava-obby-v28-stable.html','sky-rush-storm-circuit-v5-stable.html','review/v29/index.html','review/v29/lava-v29-candidate.html','review/v29/storm-v29-candidate.html','review/v29-rc3/index.html','review/v29-rc3/lava-v29-candidate.html','review/v29-rc3/storm-v29-candidate.html','review/v29-rc4/index.html','review/v29-rc4/lava-v29-candidate.html','review/v29-rc4/storm-v29-candidate.html','assets/sky-rush-v28.css','assets/sky-rush-boot-v28.js','assets/vendor/three-0.160.1/three.module.min.js','assets/vendor/three-0.160.1/GLTFLoader.js','assets/vendor/three-0.160.1/BufferGeometryUtils.js'];
          async function get(file){const response=await fetch(base+file+'?rc5verify='+version,{signal:AbortSignal.timeout(15000),cache:'no-store'});return {status:response.status,bytes:Buffer.from(await response.arrayBuffer())}}
          (async()=>{let browser;try{
            const hub='review/v29-rc5/index.html',expected=fs.readFileSync(path.join(root,hub));let ready=false;
            for(let i=0;i<18;i++){const r=await get(hub);if(r.status===200&&r.bytes.equals(expected)){ready=true;break}await new Promise(r=>setTimeout(r,5000))}assert(ready,'Expected RC5 hub is not live');
            for(const file of [...added,...preserved]){const r=await get(file),local=fs.readFileSync(path.join(root,file));const row={file,status:r.status,sha256:h(r.bytes),sameBytes:r.bytes.equals(local)};report.http.push(row);assert.equal(row.status,200,file);assert(row.sameBytes,file+' differs from publication');}
            browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});report.browser=browser.version();
            for(const stage of ['lava','storm']){
              const context=await browser.newContext({viewport:{width:1024,height:650},hasTouch:true,isMobile:true,deviceScaleFactor:1});const page=await context.newPage();page.setDefaultTimeout(15000);const row={stage,errors:[],requests:[],httpErrors:[]};
              page.on('pageerror',e=>row.errors.push(e.message));page.on('request',r=>row.requests.push({url:r.url(),method:r.method()}));page.on('response',r=>{if(r.status()>=400)row.httpErrors.push({url:r.url(),status:r.status()})});
              try{
                await page.goto(base+hub+'?rc5verify='+version,{waitUntil:'networkidle'});assert.match(await page.title(),/RC5/);
                if(stage==='lava')await page.screenshot({path:'evidence/rc5-live-hub.png'});
                await page.locator('[data-stage="'+stage+'"]').tap();const frame=await(await page.locator('iframe').elementHandle()).contentFrame();
                await frame.locator('#startRun:not([disabled])').waitFor();assert.equal(await frame.locator('#game canvas').count(),1);assert.equal(await frame.evaluate(()=>typeof window.__rc5QA),'undefined');
                await frame.locator('#startRun').tap();await frame.waitForFunction(()=>Number(document.getElementById('timer').textContent)>0);
                await frame.locator('#jump').tap();await frame.waitForFunction(()=>document.getElementById('message').textContent==='Jump!');
                await page.locator('#parentInfo').tap();await frame.locator('#readyOverlay:not([hidden])').waitFor();const timer=await frame.locator('#timer').textContent();await page.waitForTimeout(150);assert.equal(await frame.locator('#timer').textContent(),timer);
                await page.locator('#closePrivacy').tap();await frame.locator('#startRun').tap();await frame.waitForFunction(t=>Number(document.getElementById('timer').textContent)>Number(t),timer);
                await frame.locator('#pause').tap();await page.screenshot({path:'evidence/rc5-live-'+stage+'.png'});await page.locator('#endSession').tap();assert.equal(await page.locator('iframe').count(),0);assert(await page.locator('#hub').isVisible());
                assert.deepEqual(row.errors,[]);assert.deepEqual(row.httpErrors,[]);assert(row.requests.every(r=>r.method==='GET'&&(!r.url.startsWith('http')||r.url.startsWith(base))));row.pass=true;
              }catch(e){row.pass=false;row.error=e.stack||String(e)}finally{report.runtime.push(row);await context.close()}
            }
            assert(report.runtime.every(r=>r.pass));report.pass=true;
          }catch(e){report.pass=false;report.error=e.stack||String(e)}finally{if(browser)await browser.close();report.finished=new Date().toISOString();fs.writeFileSync('evidence/rc5-live.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));if(!report.pass)process.exitCode=1}})();
          JS
          node "$RUNNER_TEMP/rc5-live/check.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-rc5-live-verification
          path: evidence/
          retention-days: 30
