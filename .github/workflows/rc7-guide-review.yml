name: RC7 optional path guide review
on:
  push:
    branches: [review/sky-rush-rc7-path-guide-20261105]
    paths: [.github/workflows/rc7-guide-review.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 98856342a2f2c13227145865e079d780f2a37db7
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: sky-rc6-goals-evidence
          run-id: 41817539343
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated additive candidate
        run: |
          mkdir -p evidence
          python - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          names=subprocess.check_output(['git','ls-files','-z'],cwd='app').decode().split('\0')
          h={n:hashlib.sha256((Path('app')/n).read_bytes()).hexdigest() for n in names if n}
          Path('evidence/baseline.json').write_text(json.dumps(h,indent=2))
          PY
          (cd app && python ../tooling/tools/rc7/build.py)
          cp app/rc7-payload-hashes.json evidence/
          python tooling/tools/rc7/prepare.py
          for f in app/review/v29-rc7/*.js; do node --check "$f"; done
          node evidence/unit.mjs app/review/v29-rc7 evidence/unit-results.json
      - name: Prepare browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/rc7" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/rc7/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Browser regression and guide interactions
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/rc7/node_modules
        run: node evidence/runtime-test.cjs app evidence/runtime
      - name: Four ordinary-input routes
        continue-on-error: true
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/rc7/node_modules
        run: |
          node evidence/routes.mjs --root "$GITHUB_WORKSPACE/app" --browser chromium --mode practice --out "$GITHUB_WORKSPACE/evidence/routes-practice" --timeout-ms 90000
          node evidence/routes.mjs --root "$GITHUB_WORKSPACE/app" --browser chromium --mode challenge --out "$GITHUB_WORKSPACE/evidence/routes-guided-challenge" --timeout-ms 90000
      - name: Gate results and original-file preservation
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          e=Path('evidence');a=Path('app')
          baseline=json.loads((e/'baseline.json').read_text())
          changed=[n for n,h in baseline.items() if not (a/n).exists() or hashlib.sha256((a/n).read_bytes()).hexdigest()!=h]
          paths=['unit-results.json','runtime/results.json','routes-practice/results.json','routes-guided-challenge/results.json']
          data={p:json.loads((e/p).read_text()) if (e/p).exists() else None for p in paths}
          summary={'baselineFiles':len(baseline),'changed':changed,'results':{k:v.get('summary',{'passed':v.get('passed'),'failed':v.get('failed')}) if v else None for k,v in data.items()}}
          (e/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary))
          assert not changed
          assert data['unit-results.json']['failed']==0 and data['unit-results.json']['passed']==12
          assert data['runtime/results.json']['summary']=={'passed':8,'failed':0,'total':8}
          for p in paths[2:]:assert data[p]['summary']['passed']==2 and data[p]['summary']['failed']==0
          assert not list((a/'review/v29-rc7').glob('*.glb'))
          PY
      - name: Save passing candidate only
        run: |
          cd app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/v29-rc7
          git commit -m 'Add RC7 optional visual path guide and assisted-attempt rules; preserve all earlier files'
          git push origin HEAD:refs/heads/review/sky-rush-rc7-tested-20261105
          git rev-parse HEAD > ../evidence/payload-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-rc7-guide-evidence
          path: |
            evidence/
            app/review/v29-rc7/
            tooling/tools/rc7/
          retention-days: 30
