<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bounce Lab — Girl Edition</title><style>body{margin:0;background:#162044;color:white;font-family:system-ui;text-align:center}header{padding:18px}main{margin:auto;max-width:850px}.game{margin:12px;background:linear-gradient(#5ca9d5,#c3f2e4);border-radius:25px;color:#143754;padding:24px;min-height:500px}h1{margin:5px}#girl{font-size:95px;display:block;margin:15px auto;transition:transform .25s}#girl.cheer{animation:hop .6s 3}@keyframes hop{50%{transform:translateY(-35px) rotate(8deg)}}.pads{display:flex;gap:12px;justify-content:center;margin:50px 0 25px}.pads button{border:0;border-radius:50%;width:30%;max-width:160px;height:90px;font-size:32px;font-weight:bold;color:#173c5b;background:#a7ed81}.pads button:nth-child(2){background:#c6a2ed}.pads button:nth-child(3){background:#ffc58a}button{touch-action:manipulation}#stars{font-size:28px;color:#ffd75a}#seq{font-size:30px;font-weight:900;margin-top:20px}.actions button{padding:12px 20px;border-radius:14px;border:0}#msg{min-height:30px;font-weight:700}</style><header><h1>Bounce Lab · Girl Edition</h1><div>Reach the rocket! 🚀</div></header><main><div class="game"><div id="stars">☆☆☆☆☆☆</div><div id="seq"></div><span id="girl" role="img" aria-label="Girl jumping">👧🏻</span><div id="msg" aria-live="polite">Choose the next number!</div><div class="pads" id="pads"></div><div id="progress"></div></div><div class="actions"><button onclick="reset()">↻ Play again</button> <a href="character-lab.html" style="display:inline-block;background:#314b82;color:white;padding:13px 19px;border-radius:14px;margin:8px;text-decoration:none">Explore 3D character motions →</a></div></main><script>const rounds=[[2,2],[3,3],[5,2],[4,4],[7,3],[9,5]];let i=0,busy=false,token=0;function render(){busy=false;const[a,d]=rounds[i],correct=a+3*d;document.querySelector('#seq').textContent=[a,a+d,a+2*d,'?'].join(' › ');document.querySelector('#stars').textContent='★'.repeat(i)+'☆'.repeat(6-i);document.querySelector('#progress').textContent=(i+1)+' / 6';const pads=document.querySelector('#pads');pads.innerHTML='';let opts=[correct-d,correct,correct+d];for(let j=2;j>0;j--){let k=Math.floor(Math.random()*(j+1));[opts[j],opts[k]]=[opts[k],opts[j]]}for(const v of opts){const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(busy)return;if(v!==correct){document.querySelector('#msg').textContent='Try again! 💜';return}busy=true;document.querySelector('#msg').textContent='Amazing! ⭐';document.querySelector('#stars').textContent='★'.repeat(i+1)+'☆'.repeat(5-i);document.querySelector('#girl').classList.remove('cheer');void document.querySelector('#girl').offsetWidth;document.querySelector('#girl').classList.add('cheer');let t=token;setTimeout(()=>{if(t!==token)return;if(i===5){document.querySelector('#msg').textContent='🚀 You did it! Six stars!';pads.innerHTML='';document.querySelector('#seq').textContent='VICTORY!';}else{i++;render()}},1900)};pads.append(b)}}function reset(){token++;i=0;document.querySelector('#girl').classList.remove('cheer');document.querySelector('#msg').textContent='Choose the next number!';render()}render();</script></html>
