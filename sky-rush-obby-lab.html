<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Rush Adventure — Free Roam Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#111a3a;color:#fff;font-family:system-ui}header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#ffdf90}#game{height:72dvh;min-height:400px;position:relative;overflow:hidden;background:#8cd6ff}#hud{position:absolute;top:12px;left:12px;z-index:3;background:#142d5cbb;padding:10px;border-radius:12px;font-weight:700}#message{position:absolute;top:12px;right:12px;background:#1b315cb8;padding:10px;border-radius:12px;z-index:3;max-width:55%}#controls{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,52px);gap:5px}button{border:1px solid #8aa9e7;background:#334c8a;color:#fff;border-radius:12px;font-weight:800;font-size:19px;touch-action:none}#pad button:nth-child(1){grid-column:2}#pad button:nth-child(2){grid-column:1;grid-row:2}#pad button:nth-child(3){grid-column:2;grid-row:2}#pad button:nth-child(4){grid-column:3;grid-row:2}#jump{background:#b94fcf;padding:20px 30px}#status{font-size:13px;padding:8px 16px;color:#d8e4ff}#file{max-width:210px}#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px}#reset{font-size:14px;padding:10px}#game canvas{display:block} @media(max-width:600px){header h2{font-size:18px}#game{height:63dvh;min-height:340px}#message{font-size:12px}#pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}#jump{padding:16px}}</style></head><body><header><h2>🌟 Sky Rush Adventure · Obby Lab</h2><a href="./sky-rush-worlds.html">← 30 classic levels</a></header><div id="top"><label>Optional private girl GLB: <input id="file" type="file" accept=".glb"></label><button id="reset">↻ Restart</button><span>Prototype: free movement, jumping, moving hazards</span></div><div id="game"><div id="hud">⭐ <span id="score">0</span>/5 · ❤️ <span id="lives">3</span></div><div id="message">Move freely, collect five stars and reach the portal!</div></div><div id="controls"><div id="pad"><button data-dir="forward">▲</button><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div><button id="jump">JUMP</button></div><div id="status">Uses a temporary test character until you privately choose the existing animated girl. No model is uploaded.</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const host=document.getElementById('game'),msg=document.getElementById('message'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color('#90d8ff');scene.fog=new THREE.Fog('#90d8ff',25,75);const camera=new THREE.PerspectiveCamera(62,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;host.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7788aa,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(8,18,9);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7}),groundMat=mat('#79d1ab'),blockMat=mat('#b5a7ee'),dangerMat=mat('#fa6580');function box(x,y,z,w,h,d,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);scene.add(mesh);return mesh}
box(0,-.35,-10,12,.7,40,groundMat);for(let i=0;i<8;i++){box(i%2?4:-4,.1,-4-i*4,2,.4,2,blockMat)}
const obstacles=[];for(let i=0;i<4;i++){const pivot=new THREE.Group();pivot.position.set(0,.65,-6-i*6);scene.add(pivot);const bar=new THREE.Mesh(new THREE.BoxGeometry(5,.25,.25),dangerMat);pivot.add(bar);obstacles.push({pivot,bar})}
const stars=[];const gold=new THREE.MeshStandardMaterial({color:'#ffe164',emissive:'#f5a928',emissiveIntensity:.6});for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.42),gold);m.position.set(i%2?2:-2,1.2,-4-i*6);scene.add(m);stars.push(m)}
const portal=new THREE.Mesh(new THREE.TorusGeometry(1.25,.16,12,44),new THREE.MeshStandardMaterial({color:'#ffb2ee',emissive:'#a956f1',emissiveIntensity:1}));portal.position.set(0,1.5,-33);scene.add(portal);
const player=new THREE.Group();scene.add(player);const skin=mat('#f0b6a6'),pink=mat('#ec78bb'),hair=mat('#7c4e3b');function part(parent,g,m,x,y,z){const mesh=new THREE.Mesh(g,m);mesh.position.set(x,y,z);parent.add(mesh);return mesh}function dummy(){player.clear();part(player,new THREE.CapsuleGeometry(.3,.6,5,10),pink,0,1.05,0);part(player,new THREE.SphereGeometry(.28,12,10),skin,0,1.72,0);part(player,new THREE.SphereGeometry(.29,12,10),hair,0,1.85,-.08);for(const side of [-1,1]){part(player,new THREE.CapsuleGeometry(.11,.5,4,8),pink,side*.45,1.12,0);part(player,new THREE.CapsuleGeometry(.12,.45,4,8),mat('#5e7bd1'),side*.17,.42,0)}}dummy();
let mixer=null,clipMap={};document.getElementById('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const buffer=await file.arrayBuffer();const gltf=await new Promise((ok,no)=>new GLTFLoader().parse(buffer,'',ok,no));player.clear();const model=gltf.scene;const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3());model.scale.setScalar(1.85/Math.max(.001,size.y));model.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(model),center=b2.getCenter(new THREE.Vector3());model.position.set(-center.x,-b2.min.y,-center.z);player.add(model);mixer=new THREE.AnimationMixer(model);clipMap={};for(const clip of gltf.animations)clipMap[clip.name.toLowerCase()]=clip;status.textContent='Private animated girl loaded: '+gltf.animations.length+' clips. No upload.'}catch(err){status.textContent='Could not load model: '+err.message;dummy()}};
const keys=new Set();const dirs=['forward','back','left','right'];function bind(btn){const dir=btn.dataset.dir;const off=e=>{e.preventDefault();keys.delete(dir)};btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys.add(dir)});btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off)}document.querySelectorAll('[data-dir]').forEach(bind);addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.add('forward');if(['ArrowDown','s','S'].includes(e.key))keys.add('back');if(['ArrowLeft','a','A'].includes(e.key))keys.add('left');if(['ArrowRight','d','D'].includes(e.key))keys.add('right');if(e.code==='Space'){e.preventDefault();jump()}});addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.delete('forward');if(['ArrowDown','s','S'].includes(e.key))keys.delete('back');if(['ArrowLeft','a','A'].includes(e.key))keys.delete('left');if(['ArrowRight','d','D'].includes(e.key))keys.delete('right')});document.getElementById('jump').onclick=jump;
let vy=0,onGround=true,score=0,lives=3,won=false,invulnerable=0;function jump(){if(!onGround||won)return;vy=8;onGround=false;msg.textContent='Jump!';}function reset(){player.position.set(0,0,3);vy=0;onGround=true;score=0;lives=3;won=false;invulnerable=0;stars.forEach(x=>x.visible=true);document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;msg.textContent='Explore the course and collect five stars!'}document.getElementById('reset').onclick=reset;reset();
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;let dx=0,dz=0;if(keys.has('forward'))dz-=1;if(keys.has('back'))dz+=1;if(keys.has('left'))dx-=1;if(keys.has('right'))dx+=1;const len=Math.hypot(dx,dz)||1;if(!won){player.position.x=THREE.MathUtils.clamp(player.position.x+dx/len*6*dt,-5.6,5.6);player.position.z=THREE.MathUtils.clamp(player.position.z+dz/len*6*dt,-34,7)}if(!onGround){vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}}if(mixer)mixer.update(dt);obstacles.forEach((o,i)=>{o.pivot.rotation.y=time*(i%2?1.2:-1.2);if(invulnerable<=0&&!won&&Math.abs(player.position.z-o.pivot.position.z)<.38&&player.position.y<.75){const localX=player.position.x*Math.cos(o.pivot.rotation.y);if(Math.abs(localX)<2.5){lives--;invulnerable=1.5;document.getElementById('lives').textContent=lives;msg.textContent='Ouch! Try another route';if(lives<=0){msg.textContent='Try again — tap Restart';won=true}}}});invulnerable-=dt;stars.forEach(m=>{m.rotation.y+=dt*2;m.position.y=1.2+Math.sin(time*3+m.position.z)*.15;if(m.visible&&Math.hypot(player.position.x-m.position.x,player.position.z-m.position.z)<.85){m.visible=false;score++;document.getElementById('score').textContent=score;msg.textContent='⭐ Star collected!'}});portal.rotation.z+=dt*.25;if(score===5&&player.position.z<-31&&!won){won=true;msg.textContent='🏆 Victory! You escaped the Obby!'}const follow=new THREE.Vector3(player.position.x,player.position.y+5.3,player.position.z+9);camera.position.lerp(follow,.085);camera.lookAt(player.position.x,player.position.y+1.2,player.position.z-4);renderer.render(scene,camera)}function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();loop();
</script></body></html>
